# Ambiente completo: API + PostgreSQL + Prometheus (com regras de alerta).
#   docker compose up --build
#   API:        http://localhost:8080
#   Prometheus: http://localhost:9090  (aba Alerts)
# Para usar o Claude real: ANTHROPIC_API_KEY=... LLM_PROVIDER=anthropic docker compose up --build

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-key-change-me}
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.13.4
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
